titolo: <strong>Nema</strong> Ensemble
frase_it: Un ensemble per la musica <em>di ricerca</em> — repertorio contemporaneo, scrittura spettrale, elettronica e improvvisazione.
frase_en: An ensemble for <em>research music</em> — contemporary repertoire, spectral writing, electronics and improvisation.
logo: /uploads/nema_logo_new.svg
testo_it: <p>Andrea Riccio è pianista e <strong>direttore artistico</strong> del NEMA Ensemble, con cui ha vinto il bando dell'International Ensemble Modern Academy di Francoforte. Con l'ensemble ha ideato progetti come <em>BachBjörk</em> e <em>Resonant Bends</em>, presentati all'Accademia Chigiana, alla Fondazione Pietà dei Turchini, al Conservatorio di Napoli e al BankAustria Salon di Vienna.</p>
testo_en: <p>Andrea Riccio is pianist and <strong>artistic director</strong> of the NEMA Ensemble, with which he won the International Ensemble Modern Academy call in Frankfurt. With the ensemble he has conceived projects such as <em>BachBjörk</em> and <em>Resonant Bends</em>, presented at the Accademia Chigiana, the Fondazione Pietà dei Turchini, the Naples Conservatory and the BankAustria Salon in Vienna.</p>
