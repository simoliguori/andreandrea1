      url: https://www.musicpaper.it/milano-isole-sonore-cesare-picco-pianoforte-esoterico-andrea-riccio/

- titolo: Resonant Bends
  data: "2025-10-05"
  sottotitolo_it: <span class="nema-mark">Nema Ensemble</span> × mi·ɽài — Contemporary Speech
  luogo_it: Spazio Arena · Avellino
  mostra_data: true
  descrizione_it: "Un concerto sul timbro come <i>forza generativa della forma</i>: dal pensiero spettrale francese alle radici in Debussy e Messiaen, la forma emerge dalla trasformazione interna del suono — fino a <i>Nuages</i> di Debussy. Visual audio-reattivi improvvisati in TouchDesigner."
  descrizione_en: "A concert on timbre as a <i>generative force of form</i>: from French spectral thought to roots in Debussy and Messiaen, form emerges from the inner transformation of sound — up to Debussy's <i>Nuages</i>. Real-time audio-reactive visuals improvised in TouchDesigner."
  programma: Francesco De Simone · Claude Debussy · Tristan Murail · Rouzbeh Rafie · NEMA · Yan Maresz · Olivier Messiaen
