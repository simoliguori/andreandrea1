- titolo: Isole Sonore
  data: "2025-11-26"
  sottotitolo_it: Recital · direzione artistica <b>Cesare Picco</b>
  sottotitolo_en: Recital · artistic direction <b>Cesare Picco</b>
  luogo_it: Aula Magna, Università Bocconi · Milano
  luogo_en: Aula Magna, Bocconi University · Milan
  mostra_data: true
  descrizione_it: Un recital raffinato ed <i>esoterico</i> sulle dimensioni spirituali del suono — Gurdjieff, Scelsi, Satie e Battiato, voci unite dal pensiero orientale e da un approccio trascendentale alla musica. «Nell'esecuzione estemporanea si abbandona il Sé e ci si lascia attraversare dalle energie.»
  descrizione_en: A refined, <i>esoteric</i> recital on the spiritual dimensions of sound — Gurdjieff, Scelsi, Satie and Battiato, voices bound by Eastern thought and a transcendental approach to music. «In extemporaneous playing one abandons the Self and lets oneself be traversed by energies.»
  programma: G. I. Gurdjieff · Giacinto Scelsi · Erik Satie · Franco Battiato
  copertina: /uploads/p6.jpg
  formato_copertina: normale
  galleria:
    - foto: /uploads/p5.jpg
      alt: Andrea Riccio — Isole Sonore, dettaglio
    - foto: /uploads/p1.jpg
      alt: Andrea Riccio — Isole Sonore
    - foto: /uploads/p2.jpg
      alt: Andrea Riccio — Isole Sonore
    - foto: /uploads/p3.jpg
      alt: Andrea Riccio — Isole Sonore
    - foto: /uploads/p4.jpg
      alt: Andrea Riccio — Isole Sonore
