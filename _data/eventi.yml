- titolo: Devi Morire
  data: "2026-01-01"
  etichetta: 12h · durational
  sottotitolo_it: (Dissing Love) · due pianoforti con <b>Marino Formenti</b>
  sottotitolo_en: (Dissing Love) · two pianos with <b>Marino Formenti</b>
  luogo_it: Museo Nitsch — Fondazione Morra · Napoli · performance-durata 12 ore
  luogo_en: Museo Nitsch — Fondazione Morra · Naples · 12-hour durational performance
  mostra_data: false
  descrizione_it: "Due pianoforti, «le musiche di nessuno». Insieme <i>battle</i> e responsorio: «DEVI MORIRE», <i>memento mori</i> — il più tenerissimo augurio del nulla. Lo spazio si svuota e si riempie; lo spettatore ascolta, non-esiste, gioca con loro."
  descrizione_en: "Two pianos, «nobody's music». At once a <i>battle</i> and a responsory: «DEVI MORIRE», <i>memento mori</i> — the most tender wish for nothingness. Space empties and fills; the spectator listens, un-exists, plays with them."
  copertina: /uploads/dm8.jpg
  formato_copertina: ritaglio
  galleria:
