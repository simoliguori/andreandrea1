# Pannello Pages CMS (https://app.pagescms.org) per il sito di Andrea Riccio.
# Ogni evento e ogni video è un file a sé: nel pannello si vede la lista, si clicca e si modifica.
media:
  input: uploads
  output: /uploads
  categories: [image, document]
  rename: safe

content:
  - name: copertina
    label: Copertina
    type: file
    path: _data/copertina.yml
    format: yaml
    fields:
      - name: nome
        label: "Nome"
        type: string
        description: "Il nome grande in apertura (con l'effetto glitch)."
      - name: righe
        label: "Righe sotto al nome (max 4 — le barre /// si aggiungono da sole)"
        type: object
        list:
          max: 4
          collapsible:
            collapsed: false
            summary: "{testo_it}"
        fields:
          - name: testo_it
            label: "Testo (italiano)"
            type: string
          - name: testo_en
            label: "Testo (inglese)"
            type: string
            description: "Se vuoto resta quello italiano."
      - name: foto
        label: Foto di sfondo
        type: image
        description: "Il ritratto in bianco e nero dietro al nome."

  - name: info
    label: "00 · Info"
    type: file
    path: _data/info.yml
    format: yaml
    fields:
      - name: titolo_sezione_it
        label: "Titolo della sezione (italiano)"
        type: string
        description: "Il titolino della sezione, accanto al numero."
      - name: titolo_sezione_en
        label: "Titolo della sezione (inglese)"
        type: string
        description: "Se vuoto resta quello italiano."
      - name: paragrafi
        label: "Biografia — paragrafi (il primo è mostrato grande)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Paragrafo {index}"
        fields:
          - name: testo_it
            label: "Testo (italiano)"
            type: rich-text
            options:
              format: html
              media: false
              switcher: false
          - name: testo_en
            label: "Testo (inglese)"
            type: rich-text
            description: "Se vuoto resta quello italiano."
            options:
              format: html
              media: false
              switcher: false
      - name: citazioni
        label: "Citazioni dalla stampa (frasi grandi in corsivo, 3 per riga)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{testo} — {fonte}"
        fields:
          - name: testo
            label: "Citazione"
            type: string
            description: "Con le virgolette, es. «un vero virtuoso»."
          - name: fonte
            label: "Fonte"
            type: string
            description: "Es. La Repubblica"
      - name: stampa_titolo_it
        label: "Rassegna stampa — etichetta (italiano)"
        type: string
      - name: stampa_titolo_en
        label: "Rassegna stampa — etichetta (inglese)"
        type: string
      - name: stampa
        label: "Rassegna stampa — link"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{testo}"
        fields:
          - name: testo
            label: "Testo del link"
            type: string
            description: "Es. Musicpaper · Isole Sonore"
          - name: url
            label: "Indirizzo (URL)"
            type: string
      - name: galleria
        label: Foto sotto la biografia
        type: image
        description: "Consigliate 3 o 4 foto verticali."
        options:
          multiple: true

  - name: live
    label: "01 · Live — titoli"
    type: file
    path: _data/live.yml
    format: yaml
    fields:
      - name: titolo_sezione_it
        label: "Titolo della sezione (italiano)"
        type: string
        description: "Il titolino della sezione, accanto al numero."
      - name: titolo_sezione_en
        label: "Titolo della sezione (inglese)"
        type: string
        description: "Se vuoto resta quello italiano."
      - name: prossimi_it
        label: "Etichetta \"Prossimi\" (italiano)"
        type: string
      - name: prossimi_en
        label: "Etichetta \"Prossimi\" (inglese)"
        type: string
      - name: nessuna_data_it
        label: "Testo quando non ci sono date (italiano)"
        type: string
      - name: nessuna_data_en
        label: "Testo quando non ci sono date (inglese)"
        type: string
      - name: passati_it
        label: "Etichetta \"Passati\" (italiano)"
        type: string
      - name: passati_en
        label: "Etichetta \"Passati\" (inglese)"
        type: string

  - name: eventi
    label: "01 · Live — eventi"
    type: collection
    path: _eventi
    format: yaml-frontmatter
    filename:
      template: "{giorno}-{titolo}.md"
      field: false
    view:
      fields: [titolo, giorno, sede]
      primary: titolo
      sort: [giorno, titolo]
      search: [titolo, sede, citta]
      default:
        sort: giorno
        order: desc
    fields:
      # — Intestazione della card —
      - name: titolo
        label: Titolo
        type: string
        required: true
        description: Il titolo grande dell'evento.
      - name: giorno
        label: Data
        type: date
        required: true
        description: Data futura → l'evento compare in "Prossimi". Dopo la data passa da solo in "Passati" (il sito si aggiorna ogni notte).
        options:
          format: yyyy-MM-dd
      - name: giorno_fine
        label: Data di fine
        type: date
        description: Facoltativa, solo per eventi di più giorni (es. 11–13 settembre). Lasciala vuota per eventi di un giorno.
        default: ""
        options:
          format: yyyy-MM-dd
      - name: ora
        label: Orario
        type: string
        description: Facoltativo, compare nell'agenda dei Prossimi. Es. "h21".
      - name: etichetta
        label: Etichetta accanto al titolo
        type: string
        description: Facoltativa. Se vuota viene mostrato l'anno (es. "2026").
      - name: sottotitolo_it
        label: Sottotitolo (italiano)
        type: rich-text
        description: La riga in maiuscoletto sotto al titolo. Es. "Recital · direzione artistica Cesare Picco".
        options:
          format: html
          media: false
          switcher: false
      - name: sottotitolo_en
        label: Sottotitolo (inglese)
        type: rich-text
        description: Se vuoto, in inglese resta quello italiano.
        options:
          format: html
          media: false
          switcher: false
      # — Luogo —
      - name: sede
        label: "Luogo — sede"
        type: string
        description: "Il nome del posto, es. Teatro San Carlo, Spazio Arena, MAXXI. Non serve ripeterlo nel titolo."
      - name: citta
        label: "Luogo — città (italiano)"
        type: string
        description: "Es. Napoli. Sul sito diventa Sede · Città, seguito dalla data."
      - name: citta_en
        label: "Luogo — città (inglese)"
        type: string
        description: "Solo se cambia in inglese, es. Naples, Rome, Florence. Se vuota resta quella italiana."
      - name: mostra_data
        label: Mostra la data dopo il luogo
        type: boolean
        default: true
        description: Togli la spunta per eventi senza una data precisa da mostrare.
      # — Biglietti (solo per le date future) —
      - name: link_biglietti
        label: "Biglietti / info — link"
        type: string
        description: "Se lo inserisci, la data nei Prossimi diventa cliccabile e porta qui. Quando l'evento è passato il pulsante sparisce da solo."
      - name: testo_biglietti_it
        label: "Biglietti / info — testo del pulsante (italiano)"
        type: string
        description: "Facoltativo. Se vuoto: Biglietti · Info."
      - name: testo_biglietti_en
        label: "Biglietti / info — testo del pulsante (inglese)"
        type: string
        description: "Facoltativo. Se vuoto: Tickets · Info."
      # — Testo —
      - name: descrizione_it
        label: Descrizione (italiano)
        type: rich-text
        description: Il paragrafo di presentazione. Puoi usare grassetto e corsivo.
        options:
          format: html
          media: false
          switcher: false
      - name: descrizione_en
        label: Descrizione (inglese)
        type: rich-text
        description: Se vuota, in inglese resta quella italiana.
        options:
          format: html
          media: false
          switcher: false
      - name: programma
        label: Programma
        type: rich-text
        description: Gli autori in programma, separati da " · ". Es. "Claude Debussy · John Cage · Philip Glass".
        options:
          format: html
          media: false
          switcher: false
      # — Foto —
      - name: copertina
        label: Foto di copertina
        type: image
        description: L'immagine a sinistra della card (e il flyer).
      - name: formato_copertina
        label: Formato della copertina
        type: select
        default: normale
        options:
          values:
            - name: normale
              label: Normale (proporzioni originali)
            - name: ritaglio
              label: Ritagliata verticale 4:5
            - name: locandina
              label: Locandina (centrata)
      - name: fuoco_copertina
        label: "Copertina — punto focale"
        description: "Quale parte della foto tenere quando viene ritagliata."
        type: select
        default: auto
        options:
          values:
            - name: auto
              label: Automatico
            - name: alto
              label: In alto (es. volti, teste)
            - name: centro
              label: Al centro
            - name: basso
              label: In basso (es. mani sul pianoforte)
      - name: galleria
        label: Galleria foto
        type: image
        description: Puoi caricarne più di una insieme. La prima viene mostrata larga, le altre in griglia.
        options:
          multiple: true
      - name: fuoco_foto_larga
        label: "Galleria — punto focale della prima foto (larga)"
        description: "La prima foto è molto larga e bassa: scegli cosa non deve essere tagliato."
        type: select
        default: auto
        options:
          values:
            - name: auto
              label: Automatico
            - name: alto
              label: In alto (es. volti, teste)
            - name: centro
              label: Al centro
            - name: basso
              label: In basso (es. mani sul pianoforte)
      - name: fuoco_galleria
        label: "Galleria — punto focale delle altre foto"
        type: select
        default: auto
        options:
          values:
            - name: auto
              label: Automatico
            - name: alto
              label: In alto (es. volti, teste)
            - name: centro
              label: Al centro
            - name: basso
              label: In basso (es. mani sul pianoforte)
      - name: credito_foto
        label: Crediti fotografici
        type: string
        description: Compare sotto la galleria con 📷. Es. "Luca Eleuteri · courtesy Fondazione MAXXI".
      # — Musicisti, link, allegati —
      - name: crediti
        label: Musicisti e crediti (nome · ruolo — "Evidenzia" lo mette in risalto)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nome} · {ruolo}"
        fields:
          - name: nome
            label: Nome
            type: string
          - name: ruolo
            label: Ruolo
            type: string
          - name: evidenzia
            label: Evidenzia
            type: boolean
            default: false
      - name: link
        label: Link esterni (articoli, video, sito dell'evento)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{testo}"
        fields:
          - name: testo
            label: Testo del link
            type: string
            required: true
          - name: url
            label: Indirizzo (URL)
            type: string
            required: true
      - name: allegati
        label: Allegati da scaricare (programma di sala, locandina, cartella stampa…)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{testo}"
        fields:
          - name: file
            label: File
            type: file
            required: true
          - name: testo
            label: Testo del link
            type: string
            required: true
            description: Es. "Programma di sala".

  - name: nema
    label: "02 · Nema Ensemble"
    type: file
    path: _data/nema.yml
    format: yaml
    fields:
      - name: titolo_sezione_it
        label: "Titolo della sezione (italiano)"
        type: string
        description: "Il titolino della sezione, accanto al numero."
      - name: titolo_sezione_en
        label: "Titolo della sezione (inglese)"
        type: string
        description: "Se vuoto resta quello italiano."
      - name: titolo
        label: "Titolo grande"
        type: rich-text
        description: "La parte in grassetto diventa rossa (colore Nema)."
        options:
          format: html
          media: false
          switcher: false
      - name: frase_it
        label: "Frase grande (italiano)"
        type: rich-text
        description: "Il corsivo viene mostrato in grigio."
        options:
          format: html
          media: false
          switcher: false
      - name: frase_en
        label: "Frase grande (inglese)"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: logo
        label: Logo
        type: image
      - name: testo_it
        label: "Testo (italiano)"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: testo_en
        label: "Testo (inglese)"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false
      - name: link_testo
        label: "Link — testo"
        type: string
        description: "Es. Instagram · @nemaensemble"
      - name: link_url
        label: "Link — indirizzo (URL)"
        type: string

  - name: video_testi
    label: "03 · Video — titolo"
    type: file
    path: _data/video_testi.yml
    format: yaml
    fields:
      - name: titolo_sezione_it
        label: "Titolo della sezione (italiano)"
        type: string
        description: "Il titolino della sezione, accanto al numero."
      - name: titolo_sezione_en
        label: "Titolo della sezione (inglese)"
        type: string
        description: "Se vuoto resta quello italiano."

  - name: video
    label: "03 · Video — elenco"
    type: collection
    path: _video
    format: yaml-frontmatter
    filename:
      template: "{titolo}.md"
      field: false
    view:
      fields: [titolo, autore, ordine]
      primary: titolo
      sort: [ordine, titolo]
      default:
        sort: ordine
        order: asc
    fields:
      - name: titolo
        label: Titolo
        type: rich-text
        required: true
        description: Es. "Claude Debussy — Étude n.11". Il corsivo viene mantenuto.
        options:
          format: html
          media: false
          switcher: false
      - name: autore
        label: Autore / interpreti
        type: string
        description: La riga piccola sotto al titolo. Es. "Nema Ensemble".
      - name: youtube
        label: Link YouTube
        type: string
        required: true
        description: Incolla il link del video, es. https://www.youtube.com/watch?v=… oppure https://youtu.be/…
      - name: ordine
        label: Posizione
        type: number
        description: I video sono mostrati dal numero più basso al più alto.
      - name: miniatura
        label: Miniatura
        type: image
        description: Facoltativa. Se vuota viene usata quella di YouTube.

  - name: fasce
    label: Fasce fotografiche
    type: file
    path: _data/fasce.yml
    format: yaml
    fields:
      - name: dopo_info_foto
        label: 'Fascia dopo "Info" — foto'
        type: image
        description: "La foto a tutta larghezza. Se la togli, la fascia non viene mostrata."
      - name: dopo_info_intera
        label: 'Fascia dopo "Info" — foto intera (full screen)'
        type: boolean
        description: "Accesa: la foto si vede tutta, senza ritaglio né ingrandimento, con lo sfondo sfumato ai lati. Spenta: la foto riempie la fascia (viene ritagliata e ingrandita)."
      - name: dopo_info_didascalia
        label: 'Fascia dopo "Info" — didascalia'
        type: rich-text
        description: "Il testo piccolo in basso a sinistra."
        options:
          format: html
          media: false
          switcher: false
      - name: dopo_live_foto
        label: 'Fascia dopo "Live" — foto'
        type: image
        description: "La foto a tutta larghezza. Se la togli, la fascia non viene mostrata."
      - name: dopo_live_intera
        label: 'Fascia dopo "Live" — foto intera (full screen)'
        type: boolean
        description: "Accesa: la foto si vede tutta, senza ritaglio né ingrandimento, con lo sfondo sfumato ai lati. Spenta: la foto riempie la fascia (viene ritagliata e ingrandita)."
      - name: dopo_live_didascalia
        label: 'Fascia dopo "Live" — didascalia'
        type: rich-text
        description: "Il testo piccolo in basso a sinistra."
        options:
          format: html
          media: false
          switcher: false
      - name: dopo_video_foto
        label: 'Fascia dopo "Video" — foto'
        type: image
        description: "La foto a tutta larghezza. Se la togli, la fascia non viene mostrata."
      - name: dopo_video_intera
        label: 'Fascia dopo "Video" — foto intera (full screen)'
        type: boolean
        description: "Accesa: la foto si vede tutta, senza ritaglio né ingrandimento, con lo sfondo sfumato ai lati. Spenta: la foto riempie la fascia (viene ritagliata e ingrandita)."
      - name: dopo_video_didascalia
        label: 'Fascia dopo "Video" — didascalia'
        type: rich-text
        description: "Il testo piccolo in basso a sinistra."
        options:
          format: html
          media: false
          switcher: false

  - name: contatti
    label: "04 · Contatti"
    type: file
    path: _data/contatti.yml
    format: yaml
    fields:
      - name: titolo_sezione_it
        label: "Titolo della sezione (italiano)"
        type: string
        description: "Il titolino della sezione, accanto al numero."
      - name: titolo_sezione_en
        label: "Titolo della sezione (inglese)"
        type: string
        description: "Se vuoto resta quello italiano."
      - name: contatto_testo
        label: "Contatto grande — testo"
        type: string
        description: "Es. @mastro.don.riccio oppure un indirizzo email."
      - name: contatto_url
        label: "Contatto grande — link"
        type: string
        description: "Un indirizzo web, oppure un'email (es. nome@dominio.it): diventa un link per scrivere."
      - name: link
        label: Link in fondo
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{testo}"
        fields:
          - name: testo
            label: "Testo"
            type: string
          - name: url
            label: "Indirizzo (URL)"
            type: string
      - name: firma_it
        label: "Firma (italiano)"
        type: string
        description: "Es. Compositore · Pianista · Performer"
      - name: firma_en
        label: "Firma (inglese)"
        type: string
      - name: copyright
        label: "Copyright"
        type: string
        description: "Es. © 2026 Andrea Riccio"
      - name: nota_it
        label: "Nota finale (italiano)"
        type: string
        description: "La riga piccola in fondo. Lasciala vuota per nasconderla."
      - name: nota_en
        label: "Nota finale (inglese)"
        type: string

  - name: impostazioni
    label: Impostazioni
    type: file
    path: _data/impostazioni.yml
    format: yaml
    fields:
      - name: titolo_pagina
        label: "Titolo della pagina"
        type: string
        description: "Il nome nella scheda del browser e nei risultati di Google."
      - name: descrizione
        label: "Descrizione per Google e social"
        type: text
        description: "Una o due frasi."
      - name: immagine_social
        label: Immagine di anteprima
        type: image
        description: "L'immagine mostrata quando il sito viene condiviso (WhatsApp, Instagram, Facebook…)."
