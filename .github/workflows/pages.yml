# Pubblica il sito su GitHub Pages.
# Parte a ogni modifica (anche dal pannello Pages CMS) e ogni notte,
# così gli eventi passano da "Prossimi" a "Passati" da soli.
name: Pubblica sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Comprimi le foto caricate
        run: |
          if [ -d _site/uploads ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
            sudo find _site/uploads -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
              -exec mogrify -auto-orient -resize '2400x2400>' -quality 82 -strip {} +
          fi
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
